<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omega Bot AI Room</title>
  <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
  <div class="scene scene-left"></div>
  <div class="scene scene-right"></div>
  <div class="scene scene-center"></div>

  <main class="shell">
    <section class="grid main-grid">
      <article class="panel panel-selection">
        <div class="panel-head setup-head">
          <span class="panel-kicker">Setup</span>
          <h2>Choose Your Duel</h2>
        </div>

        <!-- Compact (deck, pause and status in two rows) so the problem report fits in the same panel height. -->
        <div class="setup-row">
          <label class="sr-only" for="deckSelect">Deck</label>
          <select id="deckSelect"></select>
          <button id="startButton" class="button button-secondary" type="button">Pause auto-start</button>
        </div>

        <div class="status-line status-compact">
          <span id="statusBadge" class="status-badge">Ready</span>
          <span id="statusDetail" class="status-meta">Fetching the current panel state.</span>
        </div>

        <aside class="comment-panel" aria-label="Duel comments">
          <form id="commentForm" class="comment-form">
            <div class="comment-panel-head">
              <h3>Report a problem</h3>
              <span class="comment-anchor">Pinned to the current decision</span>
            </div>
            <label class="sr-only" for="commentText">Comment on this duel</label>
            <textarea id="commentText" rows="2" placeholder="What did the bot do wrong, and what should it have done?"></textarea>
            <div class="comment-row">
              <span class="comment-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> saves</span>
              <span id="commentStatus" class="comment-status" role="status"></span>
              <button id="commentButton" class="button button-primary" type="submit">Save comment</button>
            </div>
          </form>

          <!-- Saved comments: folded by default. -->
          <details class="comment-history">
            <summary class="comment-panel-head">
              <h3>Saved comments</h3>
              <span id="commentCount" class="count-pill">0</span>
            </summary>
            <ul id="commentList" class="comment-list"></ul>
          </details>
        </aside>
      </article>

      <article class="panel panel-carousel">
        <div class="panel-head panel-head-inline">
          <div>
            <span class="panel-kicker">Deck Gallery</span>
            <h2 id="carouselTitle">Deck Showcase</h2>
          </div>

          <div class="carousel-controls">
            <button id="carouselPrevButton" class="carousel-button" type="button" aria-label="Show previous decks">‹</button>
            <button id="carouselNextButton" class="carousel-button" type="button" aria-label="Show next decks">›</button>
          </div>
        </div>

        <div id="deckCarousel" class="deck-carousel" aria-label="Deck carousel"></div>
      </article>
    </section>

    <section class="grid grid-bottom">
      <article class="panel panel-log" id="terminalPanel" data-collapsed="false">
        <div class="panel-head panel-head-inline">
          <div>
            <span class="panel-kicker">Timeline</span>
            <h2>Terminal Output</h2>
          </div>
          <div class="actions terminal-actions">
            <label class="follow-toggle"><input type="checkbox" id="chatterToggle"> Engine chatter</label>
            <label class="follow-toggle"><input type="checkbox" id="thinkingToggle"> Thinking</label>
            <label class="follow-toggle"><input type="checkbox" id="followToggle" checked> Follow</label>
            <button id="clearLogsButton" class="button button-ghost" type="button">Clear</button>
            <button id="collapseButton" class="button button-secondary" type="button" aria-expanded="true" aria-controls="terminalBody">Collapse</button>
          </div>
        </div>

        <div class="log-layout">
          <div id="terminalBody" class="terminal-body">
            <div id="terminal" class="terminal" role="log" aria-live="off"></div>
            <button id="jumpButton" class="jump-latest" type="button" hidden>New output ↓</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div id="cardPreview" class="card-preview" aria-hidden="true">
    <div class="card-preview-frame">
      <img id="cardPreviewImage" alt="Card preview">
    </div>
  </div>

  <script src="/app.js?v=12" defer></script>
</body>
</html>
