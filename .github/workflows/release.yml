# On every push to main: builds the one-click installer (Packaging\Build-Installer.ps1) and publishes it as a GitHub
# Release tagged build-<run number>. Installed bots check the latest release when started and offer to update
# (Packaging\package\Start-DuelBot.ps1).
name: Release installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Card data and scripts
        shell: pwsh
        run: ./DuelSim/setup.ps1

      - name: Build the installer
        shell: pwsh
        env:
          DUELBOT_TAG: build-${{ github.run_number }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Packaging\Build-Installer.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          $exe = Get-ChildItem dist -Filter 'DuelBot-Setup-*.exe' | Select-Object -First 1
          Copy-Item $exe.FullName dist\DuelBot-Setup.exe
          $title = "${tag}: " + (git log -1 --format=%s)
          gh release create $tag dist\DuelBot-Setup.exe --target $env:GITHUB_SHA --title $title --notes "Commit $env:GITHUB_SHA. Download DuelBot-Setup.exe and double-click it; installed bots offer this update when started." --latest
